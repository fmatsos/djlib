# Example djlib configuration.
#
# Copy this file and adjust paths for your environment, then point djlib at
# it (configuration loading is wired up in Task 1; CLI flags to select a
# config file are added in later tasks).

[paths]
music_root = "/music"
data_root = "/data"

# The sections below are reserved for duplicate-detection thresholds
# introduced in a later milestone-1 task (see Task 10 of the implementation
# plan). They are not read by djlib yet.
#
# [duplicates.duration]
# short_ms = 2000
# medium_ms = 3000
# long_ms = 5000
#
# [duplicates.chromaprint]
# auto_equivalent = 0.985
# review_floor = 0.93
