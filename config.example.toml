# Example djlib configuration.
#
# Copy this file and adjust paths for your environment, then point djlib at
# it (configuration loading is wired up in Task 1; CLI flags to select a
# config file are added in later tasks).

[paths]
music_root = "/music"
data_root = "/data"

# Duplicate-detection thresholds, wired up in Task 10 of the implementation
# plan (`djlib.config.DjlibConfig.duplicates`). These are starting values
# subject to real-library calibration (`djlib duplicates calibrate`), not
# immutable truth -- see design §14 and §18.

[duplicates.duration]
short_ms = 2000
medium_ms = 3000
long_ms = 5000

[duplicates.chromaprint]
auto_equivalent = 0.985
review_floor = 0.93
